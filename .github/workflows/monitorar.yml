name: Monitorar Escalas PMESP

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-escalas-pmesp
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegador (Chromium) do Playwright
        run: npx playwright install --with-deps chromium

      - name: Instalar cliente VPN (openconnect, compatível com Cisco AnyConnect)
        run: sudo apt-get update -y && sudo apt-get install -y openconnect

      - name: Conectar na VPN da PMESP
        env:
          PMESP_VPN_USUARIO: ${{ secrets.PMESP_VPN_USUARIO }}
          PMESP_VPN_SENHA: ${{ secrets.PMESP_VPN_SENHA }}
        run: |
          echo "$PMESP_VPN_SENHA" | sudo openconnect \
            --background \
            --pid-file=/tmp/openconnect.pid \
            --user="$PMESP_VPN_USUARIO" \
            --passwd-on-stdin \
            --servercert pin-sha256:ccVM9Z6xyx607/QtUIoHLJcnq5m53m1crfttZ6Y6AhA= \
            https://extranet.policiamilitar.sp.gov.br/
          sleep 8
          sudo cat /tmp/openconnect.pid || (echo "❌ VPN não conectou" && exit 1)

      - name: Rodar checagem de escalas
        env:
          PMESP_USUARIO: ${{ secrets.PMESP_USUARIO }}
          PMESP_SENHA: ${{ secrets.PMESP_SENHA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PMESP_AISP: ${{ vars.PMESP_AISP }}
          LOGIN_URL: ${{ vars.LOGIN_URL }}
        run: node monitor.js

      - name: Guardar screenshot do erro (se deu ruim)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erro-screenshot
          path: erro.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Desconectar da VPN
        if: always()
        run: |
          if [ -f /tmp/openconnect.pid ]; then
            sudo kill "$(cat /tmp/openconnect.pid)" || true
          fi

      - name: Salvar lista de escalas já avisadas
        if: always()
        run: |
          git config user.name "monitor-escalas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "Atualiza escalas já avisadas [skip ci]"
          git push || true
