name: Monitorar Escalas PMESP

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-escalas-pmesp
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegador (Chromium) do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar checagem de escalas
        env:
          PMESP_USUARIO: ${{ secrets.PMESP_USUARIO }}
          PMESP_SENHA: ${{ secrets.PMESP_SENHA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PMESP_AISP: ${{ vars.PMESP_AISP }}
          LOGIN_URL: ${{ vars.LOGIN_URL }}
        run: node monitor.js

      - name: Guardar screenshot do erro (se deu ruim)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erro-screenshot
          path: erro.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Salvar lista de escalas já avisadas
        if: always()
        run: |
          git config user.name "monitor-escalas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "Atualiza escalas já avisadas [skip ci]"
          git push || true
