name: Monitorar Escalas PMESP

on:
  # CORREÇÃO 01/08/2026 (a pedido do usuário): removido o gatilho "schedule"
  # (agendamento interno do GitHub). Ele se mostrou pouco confiável na prática
  # — chegou a ficar ~12h seguidas sem disparar nenhuma vez, mesmo configurado
  # pra rodar a cada 30min (comportamento "melhor esforço" documentado do
  # próprio GitHub, mais comum em repositórios com pouco tráfego). Pra
  # contornar isso, foi configurado um serviço externo (cron-job.org) que chama
  # o mesmo workflow via workflow_dispatch a cada 30min de fora do GitHub, de
  # forma bem mais pontual. Manter os dois gatilhos ativos ao mesmo tempo
  # arriscava disparos quase simultâneos (o "schedule" acordando por conta
  # própria bem perto de um disparo do cron-job.org) — dois logins seguidos e
  # rápidos no sistema da PMESP pareciam estar deixando o servidor deles
  # instável, causando falha em cascata nas áreas seguintes de uma checagem.
  # Removendo o "schedule", só sobra o workflow_dispatch (usado tanto pelo
  # cron-job.org quanto pelo botão manual "Run workflow"), sem risco de
  # sobreposição.
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow" no GitHub, e é o que o cron-job.org chama por fora

# Necessário pra o workflow poder commitar o arquivo de "já avisados" de volta no repositório
permissions:
  contents: write

concurrency:
  group: monitor-escalas-pmesp
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    # Aumentado de 29 pra 40: desde a correção de 31/07/2026, cada AISP faz login
    # do zero (mais confiável, mas ~15-20s mais lento por área) — 40min dá folga
    # de sobra mesmo assim, já que o próprio monitor.js agora se auto-limita a
    # ~22min de checagem e para sozinho de forma limpa antes de chegar perto do
    # limite do job (ver ORCAMENTO_MAX_MINUTOS em monitor.js).
    timeout-minutes: 40
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegador (Chromium) do Playwright
        run: npx playwright install --with-deps chromium

      - name: Instalar cliente VPN (openconnect, compatível com Cisco AnyConnect)
        run: sudo apt-get update -y && sudo apt-get install -y openconnect

      - name: Conectar na VPN da PMESP
        timeout-minutes: 3
        continue-on-error: true
        id: vpn
        env:
          PMESP_VPN_USUARIO: ${{ secrets.PMESP_VPN_USUARIO }}
          PMESP_VPN_SENHA: ${{ secrets.PMESP_VPN_SENHA }}
        run: |
          # IMPORTANTE: várias tentativas anteriores (redirecionar saída + "&" +
          # "disown", depois "setsid") ainda prendiam o passo por causa de como o
          # "sudo" usa PTY por baixo dos panos no Ubuntu. Resolvido usando a flag
          # OFICIAL do próprio sudo pra rodar em segundo plano ("-b"), que já cuida
          # de tudo isso direito, sem precisar empilhar truques por cima.
          #
          # O arquivo de senha precisa poder ser LIDO pelo próprio shell do runner
          # (usuário comum) — é ele quem abre o arquivo ANTES de virar sudo, não o
          # processo do openconnect em si. Por isso não usamos sudo pra criar esse
          # arquivo (senão só o root conseguiria lê-lo).
          echo "$PMESP_VPN_SENHA" > /tmp/vpnpass
          chmod 600 /tmp/vpnpass

          sudo -b openconnect \
            --background \
            --pid-file=/tmp/openconnect.pid \
            --user="$PMESP_VPN_USUARIO" \
            --authgroup="53 - CPRV" \
            --passwd-on-stdin \
            --servercert pin-sha256:ccVM9Z6xyx607/QtUIoHLJcnq5m53m1crfttZ6Y6AhA= \
            https://extranet.policiamilitar.sp.gov.br/ \
            < /tmp/vpnpass > /tmp/openconnect.log 2>&1
          sleep 1
          rm -f /tmp/vpnpass

          echo "Aguardando o arquivo de PID da VPN aparecer..."
          ok_pid=""
          for i in $(seq 1 15); do
            if sudo test -f /tmp/openconnect.pid; then
              ok_pid="1"
              break
            fi
            sleep 1
          done
          echo "----- log do openconnect -----"
          sudo cat /tmp/openconnect.log || true
          echo "-------------------------------"
          if [ -z "$ok_pid" ]; then
            echo "❌ VPN não conectou (nenhum arquivo de PID apareceu)."
            exit 1
          fi
          sudo cat /tmp/openconnect.pid

          # O processo da VPN pode subir antes da rede/DNS interno realmente
          # ficarem prontos pra uso — em vez de confiar numa espera fixa, fica
          # tentando resolver o nome do site até funcionar de verdade (até ~60s).
          echo "Aguardando o DNS interno da PMESP responder..."
          ok=""
          for i in $(seq 1 20); do
            if getent hosts intranet.policiamilitar.sp.gov.br > /dev/null 2>&1; then
              echo "✅ DNS interno respondendo (tentativa $i)."
              ok="1"
              break
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "❌ DNS interno não respondeu depois de esperar — a VPN pode não ter conectado direito."
            exit 1
          fi

          echo ""
          echo "✅ VPN conectada com sucesso — essa etapa já terminou de verdade."
          echo "ℹ️  Se ela continuar parecendo 'presa' aqui na tela (bolinha girando sem"
          echo "    fim), é só um comportamento visual do GitHub — o processo da VPN"
          echo "    continua rodando em segundo plano de propósito até o fim do job,"
          echo "    e por causa disso o navegador às vezes não atualiza o ícone dessa"
          echo "    etapa pra 'concluído' nem libera o log ao vivo da próxima etapa."
          echo "    NÃO CANCELE o workflow por causa disso — ele já está avançando."
          echo "    Pra acompanhar: espere o job terminar (ou dê F5/reabra a aba) e"
          echo "    abra a etapa 'Rodar checagem de escalas' — o log completo, com"
          echo "    uma linha por AISP e por página, vai estar lá certinho."

      - name: Rodar checagem de escalas
        if: steps.vpn.outcome == 'success'
        env:
          PMESP_USUARIO: ${{ secrets.PMESP_USUARIO }}
          PMESP_SENHA: ${{ secrets.PMESP_SENHA }}
          PMESP_AISP: ${{ vars.PMESP_AISP }}
          LOGIN_URL: ${{ vars.LOGIN_URL }}
          NODE_ENV: production
          FORCE_COLOR: "0"
        # Continua mesmo se der erro aqui — precisamos rodar os passos seguintes
        # (screenshot, desconectar VPN, notificar) mesmo assim.
        continue-on-error: true
        id: checagem
        run: stdbuf -oL -eL node monitor.js

      - name: Registrar falha de VPN (pra poder notificar)
        if: steps.vpn.outcome == 'failure'
        run: |
          echo '{"erro":"A VPN não conseguiu conectar (ou o DNS interno não respondeu a tempo). Provavelmente instabilidade temporária do servidor VPN da PMESP.","novos":[],"resultadoPorArea":[]}' > resultado.json

      - name: Guardar screenshots de erro (se algum deu ruim)
        # "always()" (não só na falha do step inteiro): desde a correção de
        # 31/07/2026, uma AISP específica pode falhar e deixar sua própria
        # screenshot (erro_aisp_XXXXX_tN.png) mesmo que o run geral termine
        # como "sucesso" (porque as outras AISPs deram certo). Sem isso, essas
        # screenshots nunca seriam enviadas como artefato.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erro-screenshots
          path: erro*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Desconectar da VPN
        if: always()
        run: |
          if sudo test -f /tmp/openconnect.pid; then
            sudo kill "$(sudo cat /tmp/openconnect.pid)" || true
          fi
          sleep 2

      - name: Enviar notificações no Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Rótulo do módulo mostrado no resumo (ex: "[M1]"). Opcional — se não
          # configurada aqui, o código já usa "M1" como padrão automaticamente.
          MODULO_LABEL: ${{ vars.MODULO_LABEL }}
        run: stdbuf -oL -eL node notificar.js

      - name: Marcar job como falho (se algo deu errado)
        if: steps.vpn.outcome == 'failure' || steps.checagem.outcome == 'failure'
        run: exit 1

      - name: Salvar lista de escalas já avisadas
        if: always()
        run: |
          git config user.name "monitor-escalas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "Atualiza escalas já avisadas [skip ci]"
          git push || true